<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>УТКА</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0f0f12;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    .counter {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: #888;
      letter-spacing: 1px;
    }

    .counter span {
      color: #ffcc00;
      font-weight: 700;
      font-size: 2rem;
    }

    .duck-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #ffcc00;
      background: #1a1a20;
      cursor: pointer;
      font-size: 5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(255, 204, 0, 0.2), inset 0 0 15px rgba(255, 204, 0, 0.1);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      outline: none;
    }

    .duck-btn:hover {
      box-shadow: 0 15px 40px rgba(255, 204, 0, 0.35), inset 0 0 25px rgba(255, 204, 0, 0.2);
    }

    .duck-btn:active {
      transform: scale(0.92);
      box-shadow: 0 4px 15px rgba(255, 204, 0, 0.15);
    }

    .hint {
      margin-top: 2rem;
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="counter">КРЯКОВ: <span id="count">0</span></div>
  
  <button class="duck-btn" id="duckBtn">🦆</button>

  <div class="hint">жми со всей дури</div>

  <script>
    // Звук утки (свободный семпл кряканья)
    const duckAudio = new Audio('https://www.myinstants.com/media/sounds/quack_5.mp3');
    
    const btn = document.getElementById('duckBtn');
    const countDisplay = document.getElementById('count');

    // Подтягиваем старый счетчик из памяти браузера, если уже кликал
    let clicks = localStorage.getItem('duck_clicks') || 0;
    countDisplay.textContent = clicks;

    btn.addEventListener('click', () => {
      // Клонируем или сбрасываем таймкод звука, чтобы можно было спамить кликами без задержки
      duckAudio.currentTime = 0;
      duckAudio.play();

      clicks++;
      countDisplay.textContent = clicks;
      localStorage.setItem('duck_clicks', clicks);
    });
  </script>
</body>
</html>
